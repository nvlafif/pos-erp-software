spring.application.name=toko-api
spring.datasource.url=jdbc:postgresql://localhost:5432/toko_db
spring.datasource.username=postgres
spring.datasource.password=admin

# Di tahap production sebaiknya "update" diganti dengan "none" agar tidak mengubah struktur database secara otomatis
spring.jpa.hibernate.ddl-auto=update

# Kalau true, maka query SQL yang dieksekusi JPA akan ditampilkan di console (Terminal)
spring.jpa.show-sql=true