spring.application.name=toko-api
spring.datasource.url=jdbc:postgresql://localhost:5432/toko_db
spring.datasource.username=postgres
spring.datasource.password=admin

# Di tahap production sebaiknya "update" diganti dengan "none" agar tidak mengubah struktur database secara otomatis
spring.jpa.hibernate.ddl-auto=update

# Kalau true, maka query SQL yang dieksekusi JPA akan ditampilkan di console (Terminal)
spring.jpa.show-sql=true

# Konfigurasi JWT (256-bit hex secret key & masa berlaku 24 jam = 86400000 ms)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000